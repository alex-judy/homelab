---
# Role variables for ubuntu-devops-docker
compose_dir: /opt/docker
compose_filename: docker-compose.yml
compose_source_dir: "{{ playbook_dir }}/../../docker/ubuntu-devops/compose-files"
compose_source: "{{ compose_source_dir }}/runner/docker-compose.yml"
docker_user: alex
komodo_image: ghcr.io/moghtech/komodo-core:latest
forgejo_runner_image: code.forgejo.org/forgejo/runner:12
forgejo_runner_connection_name: default
forgejo_runner_url: "https://forgejo.louhome.xyz"
forgejo_runner_token: ""
forgejo_runner_name: "ubuntu-devops-runner"
forgejo_runner_labels:
  - native
  - docker
  - general
forgejo_runner_force_registration: false
# Doppler defaults (can be overridden in group_vars or host_vars)
doppler_enabled: false
doppler_token: ""
doppler_project: ""
doppler_config: "default"
compose_service_name: komodo-stack
