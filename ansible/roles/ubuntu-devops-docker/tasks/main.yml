---
- name: Install APT prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Docker official GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    state: present
    filename: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Create compose directory
  ansible.builtin.file:
    path: "{{ compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy docker compose stack files
  ansible.posix.synchronize:
    src: "{{ compose_source_dir }}/"
    dest: "{{ compose_dir }}/"
    recursive: true
    delete: true
    rsync_opts:
      - "--chown=root:root"
      - "--exclude=runner/"
  register: sync_result

- name: Create Forgejo runner data directory
  ansible.builtin.file:
    path: "{{ compose_dir }}/runner/data"
    state: directory
    owner: "1001"
    group: "1001"
    mode: "0755"

- name: Create Forgejo runner cache directory
  ansible.builtin.file:
    path: "{{ compose_dir }}/runner/data/.cache"
    state: directory
    owner: "1001"
    group: "1001"
    mode: "02775"

- name: Fix Forgejo runner data permissions recursively
  ansible.builtin.file:
    path: "{{ compose_dir }}/runner/data"
    state: directory
    owner: "1001"
    group: "1001"
    mode: "02775"
    recurse: true

- name: Check for local runner config file
  ansible.builtin.stat:
    path: "{{ compose_source_dir }}/runner/runner-config.yml"
  register: local_runner_config
  delegate_to: localhost

- name: Check if runner config already exists on target
  ansible.builtin.stat:
    path: "{{ compose_dir }}/runner/data/runner-config.yml"
  register: remote_runner_config

- name: Copy local Forgejo runner config
  ansible.builtin.copy:
    src: "{{ compose_source_dir }}/runner/runner-config.yml"
    dest: "{{ compose_dir }}/runner/data/runner-config.yml"
    owner: "1001"
    group: "1001"
    mode: "0644"
  register: runner_config_result
  when: local_runner_config.stat.exists
  no_log: true

- name: Generate Forgejo runner config from template when none exists
  ansible.builtin.template:
    src: runner-config.yml.j2
    dest: "{{ compose_dir }}/runner/data/runner-config.yml"
    owner: "1001"
    group: "1001"
    mode: "0644"
  register: runner_template_result
  when:
    - not local_runner_config.stat.exists
    - (not remote_runner_config.stat.exists or remote_runner_config.stat.size | default(0) == 0)
  no_log: true

- name: Ensure Forgejo runner environment file exists
  ansible.builtin.file:
    path: "{{ compose_dir }}/runner/data/.env"
    state: touch
    owner: "1001"
    group: "1001"
    mode: "0644"

- name: Verify Forgejo runner config file exists
  ansible.builtin.stat:
    path: "{{ compose_dir }}/runner/data/runner-config.yml"
  register: verify_runner_config

- name: Fail if Forgejo runner config was not created
  ansible.builtin.assert:
    that:
      - verify_runner_config.stat.exists
    fail_msg: "Runner config file was not created at {{ compose_dir }}/runner/data/runner-config.yml"

- name: Generate runner registration fingerprint
  ansible.builtin.copy:
    dest: "{{ compose_dir }}/runner/data/.runner-registration-hash"
    content: "{{ [forgejo_runner_url, forgejo_runner_token, forgejo_runner_name, forgejo_runner_labels | join(',')] | join('|') }}"
    owner: "1001"
    group: "1001"
    mode: "0644"
  register: runner_registration_fingerprint_result
  no_log: true
  when:
    - forgejo_runner_url != ""
    - forgejo_runner_token != ""
    - forgejo_runner_name != ""

- name: Check if runner registration file exists on target
  ansible.builtin.stat:
    path: "{{ compose_dir }}/runner/data/.runner"
  register: remote_runner_registration

- name: Remove existing Forgejo runner registration when registration state has changed
  ansible.builtin.file:
    path: "{{ compose_dir }}/runner/data/.runner"
    state: absent
  when:
    - remote_runner_registration.stat.exists
    - >
      (forgejo_runner_force_registration | bool) or
      (runner_config_result.changed | default(false)) or
      (runner_template_result.changed | default(false)) or
      (runner_registration_fingerprint_result.changed | default(false))

- name: Register Forgejo runner if not already registered or if registration state changed
  ansible.builtin.shell: |
    docker run --rm -u 1001:1001 -v "{{ compose_dir }}/runner/data:/data" \
      --workdir /data data.forgejo.org/forgejo/runner:12 \
      forgejo-runner register --config /data/runner-config.yml \
        --token "{{ forgejo_runner_token }}" \
        --name "{{ forgejo_runner_name }}" \
        --instance "{{ forgejo_runner_url }}" \
        {% if forgejo_runner_labels | length > 0 %}--labels "{{ forgejo_runner_labels | join(',') }}" \{% endif %}
        --no-interactive
  args:
    executable: /bin/bash
  register: runner_registration
  changed_when: runner_registration.rc == 0
  when:
    - >
      (forgejo_runner_force_registration | bool) or
      (not remote_runner_registration.stat.exists) or
      (runner_config_result.changed | default(false)) or
      (runner_template_result.changed | default(false)) or
      (runner_registration_fingerprint_result.changed | default(false))
    - forgejo_runner_url != ""
    - forgejo_runner_token != ""
    - forgejo_runner_name != ""
  no_log: true
