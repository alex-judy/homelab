---
# mountable TrueNAS exports for containers.  containers can override or
# extend this list if they only need a subset.
# each item must define `src` (NFS server:path) and `mount_point` within the
# container.
truenas_shares:
  - src: '{{ truenas_nfs_server }}:{{ truenas_media_share }}'
    mount_point: /mnt/media
  - src: '{{ truenas_nfs_server }}:{{ truenas_downloads_share }}'
    mount_point: /mnt/downloads
