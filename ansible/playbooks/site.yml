---
# Main playbook to configure all resources
- name: Configure all LXC containers
  hosts: lxc_containers
  gather_facts: true

  tasks:
    - name: Display starting message
      ansible.builtin.debug:
        msg: "Starting configuration of {{ inventory_hostname }}"

# Common setup for all containers
- name: Import common setup configuration
  import_playbook: lxc-common.yml

# Service-specific playbooks
- name: Import Tailscale setup configuration
  import_playbook: lxc-tailscale.yml
  tags: ["tailscale"]

- name: Import Plex setup configuration
  import_playbook: lxc-plex.yml
  tags: ["plex"]

- name: Configuration complete
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "All LXC containers configured successfully!"
          - "============================================"
          - ""
          - "Next steps:"
          - "1. Verify Plex GPU access: ssh plex 'ls -l /dev/dri'"
          - "2. Check VPN connection: ssh downloads 'docker exec gluetun wget -qO- https://ipinfo.io/ip'"
          - "3. Configure Cloudflare Tunnel routes in Zero Trust dashboard"
          - "4. Test access to services via your domain"
