---
- name: Common LXC Container Setup
  hosts: lxc_containers
  become: true
  tasks:
    - name: Wait for system to be ready
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [install, update]
    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      tags: [install, update]
    - name: Install common packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - vim
          - git
          - htop
          - net-tools
          - dnsutils
          - ca-certificates
          - gnupg
          - lsb-release
          - software-properties-common
          - nfs-common
          - tzdata
          - util-linux
        state: present
      tags: [install, update]
    - name: Set system timezone
      community.general.timezone:
        name: "{{ timezone | default('America/Chicago') }}"
      tags: [install, update]
    - name: Configure unattended upgrades
      ansible.builtin.apt:
        name: [unattended-upgrades, apt-listchanges]
        state: present
      tags: [install, update]
    - name: Enable unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        owner: root
        group: root
        mode: '0644'
      tags: [install, update]
    - name: Disable IPv6
      ansible.posix.sysctl:
        name: '{{ item }}'
        value: '1'
        state: present
        reload: true
      loop:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6
      when: disable_ipv6 | default(false)
      tags: [install, update]
