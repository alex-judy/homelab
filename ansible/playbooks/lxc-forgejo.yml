- name: Setup Forgejo LXC
  hosts: forgejo
  become: true

  vars:
    install_dir: "{{ forgejo_install_dir | default('/opt/forgejo') }}"
    data_dir: "{{ forgejo_data_dir | default('/var/lib/forgejo') }}"
    _forgejo_http_port: "{{ forgejo_http_port | default(3000) }}"
    _forgejo_ssh_port: "{{ forgejo_ssh_port | default(22) }}"
    _forgejo_domain: "{{ forgejo_domain | default(ansible_host) }}"
    _forgejo_root_url: "{{ forgejo_root_url | default('http://' ~ ansible_host ~ ':' ~ (forgejo_http_port | default(3000)) ~ '/') }}"
    forgejo_os: "{{ ansible_system | lower }}"
    forgejo_arch: >-
      {{ ansible_architecture | regex_replace('x86_64','amd64') |
         regex_replace('armv6l|armv7l','arm') |
         regex_replace('aarch64','arm64') }}
    forgejo_filename: "forgejo-{{ (forgejo_version | default('14.0.3')) }}-{{ forgejo_os }}-{{ forgejo_arch }}"
    _forgejo_verify: "{{ forgejo_verify | default(false) }}"
    _forgejo_user: "{{ forgejo_user | default('forgejo') }}"

  tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        timeout: 300

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Install runtime dependencies
      apt:
        name:
          - curl
          - wget
          - git
          - ca-certificates
        state: present

    - name: Ensure Forgejo service user exists
      user:
        name: "{{ _forgejo_user }}"
        system: yes
        createhome: yes
        home: "/home/{{ _forgejo_user }}"
        shell: /usr/sbin/nologin

    - name: Create Forgejo user .ssh directory
      file:
        path: "/home/{{ _forgejo_user }}/.ssh"
        state: directory
        owner: "{{ _forgejo_user }}"
        group: "{{ _forgejo_user }}"
        mode: "0700"

    - name: Create install directory
      file:
        path: "{{ install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create data directory
      file:
        path: "{{ data_dir }}"
        state: directory
        owner: "{{ _forgejo_user }}"
        group: "{{ _forgejo_user }}"
        mode: "0755"

    - name: Download Forgejo binary (install/update)
      get_url:
        url: >-
          {{ forgejo_binary_url | default(
            'https://codeberg.org/forgejo/forgejo/releases/download/v' ~
            (forgejo_version | default('14.0.3')) ~ '/' ~ forgejo_filename)
          }}
        dest: "/tmp/{{ forgejo_filename }}"
        mode: "0755"
        force: yes
      register: forgejo_download
      retries: 5
      delay: 10
      until: forgejo_download is succeeded
      tags:
        - install
        - update

    - name: Optionally download GPG signature
      get_url:
        url: "{{ forgejo_binary_url }}.asc"
        dest: "/tmp/{{ forgejo_filename }}.asc"
        mode: "0644"
        force: yes
      when: _forgejo_verify
      tags:
        - install

    - name: Verify Forgejo binary signature
      block:
        - name: import Forgejo public key
          command: gpg --keyserver keys.openpgp.org --recv EB114F5E6C0DC2BCDD183550A4B61A2DC5923710
          changed_when: false
          args:
            warn: false
        - name: check signature
          command: gpg --verify /tmp/{{ forgejo_filename }}.asc /tmp/{{ forgejo_filename }}
          register: gpg_check
          args:
            warn: false
          failed_when: "'OK' not in gpg_check.stderr"
      when: _forgejo_verify
      tags:
        - install

    - name: Check if Forgejo binary already exists in install directory
      stat:
        path: "{{ install_dir }}/forgejo"
      register: forgejo_installed

    - name: Copy Forgejo binary into install directory
      copy:
        src: "/tmp/{{ forgejo_filename }}"
        dest: "{{ install_dir }}/forgejo"
        mode: "0755"
        remote_src: yes
      when: forgejo_download.changed or not forgejo_installed.stat.exists
      tags:
        - install
        - update

    - name: Ensure Forgejo binary is executable
      file:
        path: "{{ install_dir }}/forgejo"
        mode: "0755"
        owner: root
        group: root

    - name: Create Forgejo custom config directory
      file:
        path: "{{ data_dir }}/custom/conf"
        state: directory
        owner: "{{ _forgejo_user }}"
        group: "{{ _forgejo_user }}"
        mode: "0750"

    # Write app.ini only if it doesn't exist to avoid overwriting
    # user-configured settings on subsequent runs. Use the update_config
    # tag to force overwrite when intentionally changing config.
    - name: Check if app.ini already exists
      stat:
        path: "{{ data_dir }}/custom/conf/app.ini"
      register: appini_stat

    - name: Write Forgejo app.ini
      copy:
        dest: "{{ data_dir }}/custom/conf/app.ini"
        owner: "{{ _forgejo_user }}"
        group: "{{ _forgejo_user }}"
        mode: "0640"
        content: |
          [server]
          SSH_DOMAIN       = {{ _forgejo_domain }}
          SSH_PORT         = {{ _forgejo_ssh_port }}
          START_SSH_SERVER = false
          DISABLE_SSH      = false
          ROOT_URL         = {{ _forgejo_root_url }}
          HTTP_PORT        = {{ _forgejo_http_port }}

          [database]
          DB_TYPE = sqlite3
          PATH    = {{ data_dir }}/data/forgejo.db

          [repository]
          ROOT = {{ data_dir }}/repositories

          [log]
          MODE      = console
          LEVEL     = info
          ROOT_PATH = {{ data_dir }}/log
      when: not appini_stat.stat.exists
      notify: restart forgejo
      tags:
        - install
        - update_config

    - name: Create systemd unit for Forgejo
      copy:
        dest: /etc/systemd/system/forgejo.service
        content: |
          [Unit]
          Description=Forgejo (Gitea fork)
          After=network.target

          [Service]
          Type=simple
          Restart=always
          RestartSec=3
          User={{ _forgejo_user }}
          WorkingDirectory={{ data_dir }}
          Environment=FORGEJO_WORK_DIR={{ data_dir }}
          Environment=FORGEJO_CUSTOM={{ data_dir }}/custom
          ExecStart={{ install_dir }}/forgejo web --port {{ _forgejo_http_port }} --work-path {{ data_dir }}

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify: restart forgejo

    - name: Reload systemd to pick up unit file
      systemd:
        daemon_reload: yes

    - name: Ensure forgejo service enabled and started
      systemd:
        name: forgejo
        enabled: yes
        state: started

    # --- SSH passthrough configuration ---
    # This wires sshd into Forgejo's key lookup API so that keys registered
    # in the Forgejo UI are validated at connection time without relying on
    # the authorized_keys file being kept in sync.

    - name: Configure sshd AuthorizedKeysCommand for Forgejo
      blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} ANSIBLE MANAGED - Forgejo SSH passthrough"
        block: |
          AuthorizedKeysCommand {{ install_dir }}/forgejo --config={{ data_dir }}/custom/conf/app.ini keys -e git -u %u -t %t -k %k
          AuthorizedKeysCommandUser {{ _forgejo_user }}
      notify: restart sshd

    - name: Display Forgejo deployment info
      debug:
        msg:
          - "Forgejo installed at {{ install_dir }}"
          - "Data directory: {{ data_dir }}"
          - "Service running on port {{ _forgejo_http_port }} (systemd: forgejo)"
          - "SSH passthrough configured via AuthorizedKeysCommand"
          - "Root URL: {{ _forgejo_root_url }}"

  handlers:
    - name: restart forgejo
      systemd:
        name: forgejo
        state: restarted

    - name: restart sshd
      systemd:
        name: ssh
        state: restarted
