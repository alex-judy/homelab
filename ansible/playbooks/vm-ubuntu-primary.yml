---
- name: Deploy Primary Ubuntu VM Stacks
  hosts: ubuntu_primary
  become: true

  vars:
    docker_dir: "/opt/docker"
    puid: "1000"
    pgid: "1000"
    tz: "America/New_York"
    domain_name: "louhome.xyz"

  tasks:
    - name: Ensure TRUENAS share mount points exist
      ansible.builtin.file:
        path: "{{ item.mount_point }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ truenas_shares | default([]) }}"
      when: truenas_shares is defined
      register: mount_dir_status
      failed_when: false

    - name: Mount TRUENAS shares (optional)
      ansible.posix.mount:
        path: "{{ item.mount_point }}"
        src: "{{ item.src }}"
        fstype: nfs
        opts: rw,vers=3
        state: mounted
      loop: "{{ truenas_shares | default([]) }}"
      when: truenas_shares is defined
      register: mount_status
      failed_when: false

    - name: Create Docker networks
      community.docker.docker_network:
        name: "{{ item }}"
        driver: bridge
      loop:
        - traefik_proxy
        - socket_proxy
        - db_network
        - download_network
      register: net_status
      failed_when: false

    - name: Deploy network stack
      community.docker.docker_compose_v2:
        project_src: "{{ docker_dir }}/network"
        state: present
      environment:
        TZ: "{{ tz }}"
        DOCKER_DIR: "{{ docker_dir }}"

    - name: Deploy management stack
      community.docker.docker_compose_v2:
        project_src: "{{ docker_dir }}/management"
        state: present
      environment:
        TZ: "{{ tz }}"
        PUID: "{{ puid }}"
        PGID: "{{ pgid }}"

    - name: Deploy monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ docker_dir }}/monitoring"
        state: present
      environment:
        TZ: "{{ tz }}"
