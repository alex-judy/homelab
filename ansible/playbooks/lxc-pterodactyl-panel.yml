- name: Setup Pterodactyl Panel LXC
  hosts: pterodactyl-panel
  become: true

  vars:
    install_dir: "{{ pterodactyl_install_dir | default('/opt/pterodactyl') }}"
    panel_port: "{{ pterodactyl_panel_port | default(8443) }}"
    db_name: "{{ pterodactyl_db_name | default('pterodactyl') }}"
    db_user: "{{ pterodactyl_db_user | default('pterodactyl') }}"
    pterodactyl_admin_username: "{{ lookup('env', 'PTERODACTYL_ADMIN_USERNAME') | default('admin') }}"
    pterodactyl_admin_email: "{{ lookup('env', 'PTERODACTYL_ADMIN_EMAIL') | default('') }}"
    pterodactyl_admin_password: "{{ lookup('env', 'PTERODACTYL_ADMIN_PASSWORD') | default('') }}"

  tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        timeout: 300
      tags:
        - install
        - update

    - name: Install packages required for adding apt repositories
      apt:
        name:
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - gnupg
        state: present
      tags:
        - install
        - update

    - name: Add Ondrej PHP PPA (Ubuntu)
      apt_repository:
        repo: ppa:ondrej/php
        state: present
      tags:
        - install
        - update

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - install
        - update

    - name: Upgrade packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      tags:
        - install
        - update

    - name: Install Pterodactyl dependencies
      apt:
        name:
          - curl
          - wget
          - git
          - openssl
          - php8.3-cli
          - php8.3-common
          - php8.3-gd
          - php8.3-mysql
          - php8.3-mbstring
          - php8.3-bcmath
          - php8.3-xml
          - php8.3-fpm
          - php8.3-curl
          - php8.3-zip
          - mariadb-server
          - redis-server
          - nginx
          - unzip
        state: present
      tags:
        - install
        - update

    - name: Get installed PHP version
      shell: php -v | grep -oP 'PHP \K[0-9]+\.[0-9]+'
      register: php_version
      changed_when: false
      tags:
        - install
        - update

    - name: Remove default PHP-FPM www pool
      file:
        path: "/etc/php/{{ php_version.stdout }}/fpm/pool.d/www.conf"
        state: absent
      tags:
        - install
        - update

    - name: Create pterodactyl system user
      user:
        name: pterodactyl
        system: yes
        shell: /bin/bash
        home: "{{ install_dir }}"
        createhome: yes
      tags:
        - install
        - update

    - name: Create install directory
      file:
        path: "{{ install_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      tags:
        - install
        - update

    - name: Download Pterodactyl Panel release (install/update)
      get_url:
        url: https://github.com/pterodactyl/panel/releases/latest/download/panel.tar.gz
        dest: /tmp/panel.tar.gz
        force: no
      register: panel_download
      tags:
        - install
        - update

    - name: Extract Pterodactyl Panel if changed
      unarchive:
        src: /tmp/panel.tar.gz
        dest: "{{ install_dir }}"
        copy: no
      when: panel_download.changed
      notify:
        - restart pterodactyl-queue
      tags:
        - install
        - update

    - name: Set permissions on install directory
      file:
        path: "{{ install_dir }}"
        owner: www-data
        group: www-data
        mode: "0755"
        recurse: yes
      tags:
        - install
        - update

    - name: Copy .env.example to .env
      shell: |
        cp "{{ install_dir }}/.env.example" "{{ install_dir }}/.env"
      args:
        creates: "{{ install_dir }}/.env"
      tags:
        - install

    - name: Ensure .env is writable by www-data
      file:
        path: "{{ install_dir }}/.env"
        owner: www-data
        group: www-data
        mode: "0640"
      tags:
        - install
        - update

    - name: Create storage directories
      file:
        path: "{{ install_dir }}/{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      loop:
        - storage/logs
        - storage/uploads
        - bootstrap/cache
      tags:
        - install
        - update

    - name: Install Composer (official installer)
      get_url:
        url: https://getcomposer.org/installer
        dest: /tmp/composer-setup.php
        mode: "0755"
      tags:
        - install

    - name: Run Composer installer
      shell: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
      args:
        creates: /usr/local/bin/composer
      tags:
        - install

    - name: Configure PHP-FPM for Pterodactyl
      copy:
        dest: "/etc/php/{{ php_version.stdout }}/fpm/pool.d/pterodactyl.conf"
        content: |
          [pterodactyl]
          user = www-data
          group = www-data
          listen = /run/php/php{{ php_version.stdout }}-fpm.sock
          listen.owner = www-data
          listen.group = www-data
          pm = dynamic
          pm.max_children = 9
          pm.start_servers = 3
          pm.min_spare_servers = 3
          pm.max_spare_servers = 6
          pm.max_requests = 200
        mode: "0644"
      register: php_fpm_config
      tags:
        - install
        - update

    - name: Validate PHP-FPM configuration
      command: "/usr/sbin/php-fpm{{ php_version.stdout }} --test"
      changed_when: false
      tags:
        - install
        - update

    - name: Restart PHP-FPM if config changed
      systemd:
        name: "php{{ php_version.stdout }}-fpm"
        state: restarted
      when: php_fpm_config is changed
      tags:
        - install
        - update

    - name: Ensure /run/php directory exists
      file:
        path: /run/php
        state: directory
        mode: "0755"
      tags:
        - install
        - update

    - name: Configure Nginx for Pterodactyl (default server)
      copy:
        dest: /etc/nginx/sites-available/pterodactyl.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              server_name _;
              root {{ install_dir }}/public;
              index index.php;

              client_max_body_size 100M;

              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_pass unix:/run/php/php{{ php_version.stdout }}-fpm.sock;
                  fastcgi_index index.php;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              }

              location ~ /\.ht {
                  deny all;
              }
          }
      notify: Reload Nginx

    - name: Enable Pterodactyl Nginx site
      file:
        src: /etc/nginx/sites-available/pterodactyl.conf
        dest: /etc/nginx/sites-enabled/pterodactyl.conf
        state: link
        force: yes
      notify: Reload Nginx

    - name: Remove all default nginx site configs
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/default
        - /etc/nginx/sites-available/default
      notify: Reload Nginx

    - name: Create systemd service for Pterodactyl queue worker
      copy:
        dest: /etc/systemd/system/pterodactyl-queue.service
        content: |
          [Unit]
          Description=Pterodactyl Queue Worker
          After=network.target redis-server.service
          Wants=pterodactyl-queue.timer

          [Service]
          Type=simple
          Restart=always
          RestartSec=3
          User=www-data
          Group=www-data
          WorkingDirectory={{ install_dir }}
          ExecStart=/usr/bin/php {{ install_dir }}/artisan queue:work --queue=default,emails --sleep=3 --tries=3

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Ensure PHP-FPM is started and enabled
      systemd:
        name: "php{{ php_version.stdout }}-fpm"
        enabled: yes
        state: started

    - name: Ensure Nginx is started and enabled
      systemd:
        name: nginx
        enabled: yes
        state: started

    - name: Ensure MariaDB is started and enabled
      systemd:
        name: mariadb
        enabled: yes
        state: started
      tags:
        - install
        - update

    - name: Ensure Redis is started and enabled
      systemd:
        name: redis-server
        enabled: yes
        state: started
      tags:
        - install
        - update

    - name: Create MariaDB database and user for Pterodactyl
      shell: |
        mariadb -e "CREATE DATABASE IF NOT EXISTS {{ db_name }};"
        mariadb -e "CREATE USER IF NOT EXISTS '{{ db_user }}'@'127.0.0.1' IDENTIFIED BY '{{ lookup('env', 'PTERODACTYL_DB_PASSWORD') | default('changeme') }}';"
        mariadb -e "GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_user }}'@'127.0.0.1'; FLUSH PRIVILEGES;"
      args:
        executable: /bin/bash
      tags:
        - install
        - update

    - name: Ensure .env has correct database settings
      lineinfile:
        path: "{{ install_dir }}/.env"
        regexp: "^DB_DATABASE="
        line: "DB_DATABASE={{ db_name }}"
        create: yes
      tags:
        - install
        - update

    - name: Ensure .env has correct database username
      lineinfile:
        path: "{{ install_dir }}/.env"
        regexp: "^DB_USERNAME="
        line: "DB_USERNAME={{ db_user }}"
        create: yes
      tags:
        - install
        - update

    - name: Ensure .env has correct database password
      lineinfile:
        path: "{{ install_dir }}/.env"
        regexp: "^DB_PASSWORD="
        line: "DB_PASSWORD={{ lookup('env', 'PTERODACTYL_DB_PASSWORD') | default('changeme') }}"
        create: yes
      tags:
        - install
        - update

    - name: Check if vendor directory exists
      stat:
        path: "{{ install_dir }}/vendor"
      register: vendor_dir
      tags:
        - install
        - update

    - name: Create ansible temp directory for www-data
      file:
        path: /var/www/.ansible/tmp
        state: directory
        owner: www-data
        group: www-data
        mode: "0700"
      tags:
        - install
        - update

    - name: Install Composer dependencies
      shell: |
        cd "{{ install_dir }}"
        composer install --no-dev --optimize-autoloader
      become_user: www-data
      when: panel_download is changed or not vendor_dir.stat.exists
      tags:
        - install
        - update

    - name: Check if database tables exist
      shell: |
        mariadb -u {{ db_user }} -p'{{ lookup('env', 'PTERODACTYL_DB_PASSWORD') | default('changeme') }}' \
          -h 127.0.0.1 {{ db_name }} \
          -e "SHOW TABLES LIKE 'users';" | grep -q users
      register: db_tables_exist
      failed_when: false
      changed_when: false
      ignore_errors: true
      tags:
        - install
        - update

    - name: Check if APP_KEY already exists
      shell: |
        grep -E '^APP_KEY=base64:' "{{ install_dir }}/.env"
      register: app_key_check
      failed_when: false
      changed_when: false
      tags:
        - install
        - update

    - name: Generate application key (first install only)
      shell: |
        cd "{{ install_dir }}"
        php artisan key:generate --force
      become_user: www-data
      when: app_key_check.rc != 0
      tags:
        - install

    - name: Run database migrations
      shell: |
        cd "{{ install_dir }}"
        php artisan migrate --seed --force
      become_user: www-data
      when: panel_download is changed or db_tables_exist.rc != 0
      tags:
        - install
        - update

    - name: Add admin user if credentials provided
      shell: |
        cd "{{ install_dir }}"
        php artisan p:user:make \
          --username="{{ pterodactyl_admin_username }}" \
          --email="{{ pterodactyl_admin_email }}" \
          --password="{{ pterodactyl_admin_password }}" \
          --name-first="{{ lookup('env', 'PTERODACTYL_ADMIN_FIRST_NAME') | default('Admin') }}" \
          --name-last="{{ lookup('env', 'PTERODACTYL_ADMIN_LAST_NAME') | default('User') }}" \
          --admin=1
      become_user: www-data
      environment:
        ANSIBLE_REMOTE_TMP: /var/www/.ansible/tmp
      when: pterodactyl_admin_email != ""
      register: admin_user_result
      failed_when:
        - admin_user_result.rc != 0
        - "'already been taken' not in admin_user_result.stdout"
        - "'already exists' not in admin_user_result.stdout"
      changed_when:
        - admin_user_result.rc == 0
        - "'already been taken' not in admin_user_result.stdout"
      tags:
        - install
        - update

    - name: Set ownership of install directory to web user
      file:
        path: "{{ install_dir }}"
        owner: www-data
        group: www-data
        recurse: yes
      tags:
        - install
        - update

    - name: Add cronjob to run artisan schedule every minute
      cron:
        name: "pterodactyl-schedule"
        user: www-data
        minute: "*"
        job: "php {{ install_dir }}/artisan schedule:run >> /dev/null 2>&1"
      tags:
        - install
        - update

    - name: Enable and start Pterodactyl queue worker
      systemd:
        name: pterodactyl-queue
        enabled: yes
        state: started
      tags:
        - install
        - update

    - name: Display deployment info
      debug:
        msg:
          - "Pterodactyl Panel installed at {{ install_dir }}"
          - "Access panel at: http://{{ ansible_host }}"
          - "Admin user: {{ pterodactyl_admin_email if pterodactyl_admin_email != '' else 'Not created - set PTERODACTYL_ADMIN_EMAIL to create' }}"
          - "Configure email and other settings in: {{ install_dir }}/.env"
          - "Services running:"
          - "  - Nginx (web server) - enabled"
          - "  - PHP-FPM (application) - enabled"
          - "  - MariaDB (database) - enabled"
          - "  - Redis (cache) - enabled"
          - "  - Queue Worker - enabled"
      tags:
        - install
        - update

    - name: Assert nginx root is Pterodactyl
      shell: nginx -T | grep -q "{{ install_dir }}/public"
      changed_when: false
      tags:
        - install
        - update

    - name: Validate nginx configuration
      command: nginx -t
      changed_when: false
      tags:
        - install
        - update

  handlers:
    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded

    - name: restart pterodactyl-queue
      systemd:
        name: pterodactyl-queue
        state: restarted
