- name: Setup Doppler for Secrets Management
  hosts: downloads
  become: true

  vars:
    doppler_token: "{{ lookup('env', 'DOPPLER_TOKEN') }}"

  tasks:
    - name: Install Doppler CLI
      shell: |
        curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh
      args:
        creates: /usr/local/bin/doppler

    - name: Verify Doppler installation
      command: doppler --version
      register: doppler_version
      changed_when: false

    - name: Configure Doppler for docker-compose
      shell: |
        cd /opt/downloads
        doppler setup --token {{ doppler_token }}
      when: doppler_token != ""
      no_log: true

    - name: Update docker-compose to use Doppler
      blockinfile:
        path: /opt/downloads/docker-compose.yml
        marker: "# {mark} DOPPLER MANAGED BLOCK"
        insertbefore: "^services:"
        block: |
          # Secrets are managed by Doppler
          # Run: doppler run -- docker-compose up -d

    - name: Create systemd service to run docker-compose with Doppler
      copy:
        dest: /etc/systemd/system/downloads-stack.service
        content: |
          [Unit]
          Description=Downloads Stack with Doppler
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/downloads
          ExecStart=/usr/local/bin/doppler run -- /usr/bin/docker compose up -d
          ExecStop=/usr/bin/docker compose down

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Enable downloads-stack service
      systemd:
        name: downloads-stack
        enabled: yes
        daemon_reload: yes
