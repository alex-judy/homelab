- name: Setup Beszel LXC
  hosts: beszel
  become: true

  vars:
    install_dir: "{{ beszel_install_dir | default('/opt/beszel') }}"
    data_dir: "{{ beszel_data_dir | default('/var/lib/beszel') }}"
    web_port: "{{ beszel_web_port | default(8090) }}"
    hub_port: "{{ beszel_hub_port | default(45876) }}"

  tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        timeout: 300

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Install runtime dependencies
      apt:
        name:
          - curl
          - wget
          - git
          - ca-certificates
          - python3-venv
          - python3-pip
        state: present

    - name: Ensure beszel user exists
      user:
        name: beszel
        system: yes
        createhome: no
        shell: /usr/sbin/nologin

    - name: Create install directory
      file:
        path: "{{ install_dir }}"
        state: directory
        owner: beszel
        group: beszel
        mode: "0755"

    - name: Create data directory
      file:
        path: "{{ data_dir }}"
        state: directory
        owner: beszel
        group: beszel
        mode: "0755"

    - name: Download Beszel binary (install/update)
      get_url:
        url: "https://github.com/henrygd/beszel/releases/latest/download/beszel_{{ ansible_system }}_{{ ansible_architecture | regex_replace('x86_64','amd64') | regex_replace('armv6l|armv7l','arm') | regex_replace('aarch64','arm64') }}.tar.gz"
        dest: /tmp/beszel.tar.gz
        force: yes # always re-fetch the "latest" asset
      register: beszel_download
      tags:
        - install
        - update

    - name: Extract Beszel binary if changed
      unarchive:
        src: /tmp/beszel.tar.gz
        dest: "{{ install_dir }}"
        copy: no
        creates: "{{ install_dir }}/beszel"
      when: beszel_download.changed
      notify: restart beszel
      tags:
        - install
        - update

    - name: Ensure beszel binary is executable
      file:
        path: "{{ install_dir }}/beszel"
        mode: "0755"
        owner: root
        group: root
      tags:
        - install
        - update

    - name: Create systemd unit for Beszel
      copy:
        dest: /etc/systemd/system/beszel.service
        content: |
          [Unit]
          Description=Beszel Hub
          After=network.target

          [Service]
          Type=simple
          Restart=always
          RestartSec=3
          User=root
          WorkingDirectory={{ install_dir }}
          ExecStart={{ install_dir }}/beszel serve --http "0.0.0.0:{{ web_port }}"

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"

    - name: Reload systemd to pick up unit file
      systemd:
        daemon_reload: yes

    - name: Ensure beszel service enabled and started
      systemd:
        name: beszel
        enabled: yes
        state: started
      tags:
        - install
        - update

    - name: Display deployment info
      debug:
        msg:
          - "Beszel installed at {{ install_dir }}/beszel"
          - "Service active on port {{ web_port }} (systemd: beszel)"
      tags:
        - install
        - update

  handlers:
    - name: restart beszel
      systemd:
        name: beszel
        state: restarted
