---
- name: Setup Beszel LXC
  hosts: beszel
  become: true

  vars:
    install_dir: "{{ beszel_install_dir | default('/opt/beszel') }}"
    data_dir: "{{ beszel_data_dir | default('/var/lib/beszel') }}"
    web_port: "{{ beszel_web_port | default(8090) }}"
    hub_port: "{{ beszel_hub_port | default(45876) }}"

  tasks:
    - name: Wait for system to be ready
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Install runtime dependencies
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - ca-certificates
          - python3-venv
          - python3-pip
        state: present

    - name: Ensure beszel user exists
      ansible.builtin.user:
        name: beszel
        system: true
        createhome: false
        shell: /usr/sbin/nologin

    - name: Create install directory
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: directory
        owner: beszel
        group: beszel
        mode: "0755"

    - name: Create data directory
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        owner: beszel
        group: beszel
        mode: "0755"

    - name: Download Beszel binary (install/update)
      ansible.builtin.get_url:
        url: >-
          https://github.com/henrygd/beszel/releases/latest/download/beszel_{{ ansible_system }}_{{
          ansible_architecture | regex_replace('x86_64', 'amd64') |
          regex_replace('armv6l|armv7l', 'arm') | regex_replace('aarch64', 'arm64') }}.tar.gz
        dest: /tmp/beszel.tar.gz
        force: true
        mode: "0600"
      register: beszel_download
      tags:
        - install
        - update
      notify: Extract Beszel binary if changed

    - name: Ensure beszel binary is executable
      ansible.builtin.file:
        path: "{{ install_dir }}/beszel"
        mode: "0755"
        owner: root
        group: root
      tags:
        - install
        - update

    - name: Create systemd unit for Beszel
      ansible.builtin.copy:
        dest: /etc/systemd/system/beszel.service
        content: |
          [Unit]
          Description=Beszel Hub
          After=network.target

          [Service]
          Type=simple
          Restart=always
          RestartSec=3
          User=root
          WorkingDirectory={{ install_dir }}
          ExecStart={{ install_dir }}/beszel serve --http "0.0.0.0:{{ web_port }}"

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify: Restart beszel

    - name: Reload systemd to pick up unit file
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Ensure beszel service enabled and started
      ansible.builtin.systemd:
        name: beszel
        enabled: true
        state: started
      tags:
        - install
        - update

    - name: Display deployment info
      ansible.builtin.debug:
        msg:
          - "Beszel installed at {{ install_dir }}/beszel"
          - "Service active on port {{ web_port }} (systemd: beszel)"
      tags:
        - install
        - update

  handlers:
    - name: Extract Beszel binary if changed
      ansible.builtin.unarchive:
        src: /tmp/beszel.tar.gz
        dest: "{{ install_dir }}"
        remote_src: true
        creates: "{{ install_dir }}/beszel"
      notify: Restart beszel

    - name: Restart beszel
      ansible.builtin.systemd:
        name: beszel
        state: restarted
