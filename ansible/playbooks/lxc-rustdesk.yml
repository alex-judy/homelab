- name: Setup Rustdesk LXC
  hosts: rustdesk
  become: true

  vars:
    install_dir: "{{ rustdesk_install_dir | default('/opt/rustdesk') }}"
    # will be set later when checking GitHub for the latest release
    rustdesk_version: "{{ rustdesk_version | default('1.1.15') }}"

  tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        timeout: 300

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - install
        - update

    - name: Upgrade packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      tags:
        - install
        - update

    - name: Install runtime dependencies
      apt:
        name:
          - curl
          - wget
          - unzip
          - ca-certificates
        state: present
      tags:
        - install
        - update

    - name: Ensure rustdesk user exists
      user:
        name: rustdesk
        system: yes
        createhome: no
        shell: /usr/sbin/nologin

    - name: Create install directory
      file:
        path: "{{ install_dir }}"
        state: directory
        owner: rustdesk
        group: rustdesk
        mode: "0755"

    - name: Query GitHub for latest Rustdesk release
      uri:
        url: https://api.github.com/repos/rustdesk/rustdesk-server/releases/latest
        return_content: yes
        headers:
          Accept: application/vnd.github.v3+json
      register: rustdesk_latest
      tags:
        - update

    - name: Set rustdesk_version fact from GitHub
      set_fact:
        rustdesk_version: "{{ rustdesk_latest.json.tag_name }}"
      when: rustdesk_latest is defined
      tags:
        - update

    - name: Download and install Rustdesk relay (hbbr) package
      apt:
        deb: "https://github.com/rustdesk/rustdesk-server/releases/download/{{ rustdesk_version }}/rustdesk-server-hbbr_{{ rustdesk_version }}_amd64.deb"
        state: present
      notify:
        - restart rustdesk-services
      tags:
        - install
        - update

    - name: Download and install Rustdesk signal (hbbs) package
      apt:
        deb: "https://github.com/rustdesk/rustdesk-server/releases/download/{{ rustdesk_version }}/rustdesk-server-hbbs_{{ rustdesk_version }}_amd64.deb"
        state: present
      notify:
        - restart rustdesk-services
      tags:
        - install
        - update

    - name: Create config directory
      file:
        path: "{{ install_dir }}/config"
        state: directory
        owner: rustdesk
        group: rustdesk
        mode: "0755"
      tags:
        - install
        - update

    - name: Create systemd unit for Rustdesk relay (hbbr)
      tags:
        - install
        - update
      copy:
        dest: /etc/systemd/system/rustdesk-relay.service
        content: |
          [Unit]
          Description=Rustdesk Relay Server (hbbr)
          After=network.target

          [Service]
          Type=simple
          Restart=always
          RestartSec=3
          User=rustdesk
          ExecStart=/usr/bin/hbbr
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"

    - name: Create systemd unit for Rustdesk signal server (hbbs)
      tags:
        - install
        - update
      copy:
        dest: /etc/systemd/system/rustdesk-signal.service
        content: |
          [Unit]
          Description=Rustdesk Signal Server (hbbs)
          After=network.target

          [Service]
          Type=simple
          Restart=always
          RestartSec=3
          User=rustdesk
          ExecStart=/usr/bin/hbbs
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"

    - name: Reload systemd to pick up unit files
      systemd:
        daemon_reload: yes
      tags:
        - install
        - update

    - name: Enable and start Rustdesk relay service
      systemd:
        name: rustdesk-relay
        enabled: yes
        state: started
      tags:
        - install
        - update

    - name: Enable and start Rustdesk signal service
      systemd:
        name: rustdesk-signal
        enabled: yes
        state: started
      tags:
        - install
        - update

    - name: Display deployment info
      debug:
        msg:
          - "Rustdesk server installed at {{ install_dir }}"
          - "Config directory: {{ install_dir }}/config"
          - "Relay service: rustdesk-relay (hbbr) - enabled"
          - "Signal service: rustdesk-signal (hbbs) - enabled"
          - "Default ports:"
          - "  - hbbr (relay): 21115/tcp, 21115/udp"
          - "  - hbbs (signal): 21114/tcp"
          - "Note: Adjust firewall rules to expose these ports if needed"
      tags:
        - install
        - update

  handlers:
    - name: restart rustdesk-services
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - rustdesk-relay
        - rustdesk-signal
