- hosts: ubuntu-devops
  become: true
  vars:
    compose_root: /opt/docker/ubuntu-devops/compose-files
  tasks:
    - name: Ensure remote compose directory exists
      ansible.builtin.file:
        path: "{{ compose_root }}"
        state: directory
        mode: "0755"

    - name: Sync compose stacks
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../docker/ubuntu-devops/compose-files/"
        dest: "{{ compose_root }}/"
        delete: true
        recursive: true

    - name: Install Doppler CLI
      ansible.builtin.shell: |
        curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh
      args:
        creates: /usr/local/bin/doppler

    - name: Find stack directories
      ansible.builtin.find:
        paths: "{{ compose_root }}"
        file_type: directory
        depth: 1
      register: stack_dirs

    - name: Deploy each stack
      ansible.builtin.shell: |
        doppler run --token={{ doppler_token }} -- docker compose up -d
      args:
        chdir: "{{ item.path }}"
      loop: "{{ stack_dirs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
