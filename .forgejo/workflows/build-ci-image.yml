---
# .forgejo/workflows/build-ci-image.yml
name: Build CI Tools Image

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "ci/images/ci-tools/Dockerfile"
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
      DOCKER_TLS_VERIFY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Forgejo registry
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
        run: |
          echo "${{ secrets.FORGEJO_AUTOMATION_SVC_ACCT_TOKEN }}" | docker login registry.louhome.xyz \
            --username ${{ vars.FORGEJO_AUTOMATION_SVC_ACCT_NAME }} \
            --password-stdin

      - name: Build and push
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
        run: |
          docker buildx rm workflow-builder || true

          docker buildx create --name workflow-builder \
            --use \
            --driver docker-container \
            --driver-opt "network=host"

          docker buildx inspect --bootstrap

          docker buildx build \
            --builder workflow-builder \
            --push \
            --cache-from type=registry,ref=registry.louhome.xyz/lou-home/ci-tools:buildcache \
            --cache-to type=registry,ref=registry.louhome.xyz/lou-home/ci-tools:buildcache,mode=max \
            -t registry.louhome.xyz/lou-home/ci-tools:latest \
            -t registry.louhome.xyz/lou-home/ci-tools:${{ github.sha }} \
            ci/images/ci-tools/

      - name: Prune Buildx and Build Cache
        if: always()
        run: |-
          docker builder prune -a -f
          docker system prune -f
