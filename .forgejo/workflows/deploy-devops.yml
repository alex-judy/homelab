---
name: Deploy Devops Stacks

on:
  workflow_dispatch: {}
  push:
    paths:
      - "docker/ubuntu-devops/**"
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: registry.louhome.xyz/lou-home/ci-tools:latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FORGEJO_RUNNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/homelab-runner
          chmod 600 ~/.ssh/homelab-runner
          ssh-keyscan -H 10.0.10.60 >> ~/.ssh/known_hosts

      - name: Install Ansible dependencies
        run: ansible-galaxy install -r ansible/requirements.yml

      - name: Run deploy playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_UBUNTU_DEVOPS_TOKEN }}
          DOCKER_DIR: ${{ vars.DOCKER_DIR }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          ansible-playbook ansible/playbooks/vm-ubuntu-devops.yml \
            -e doppler_token=$DOPPLER_TOKEN \
            -e docker_dir=$DOCKER_DIR \
            -e domain_name=$DOMAIN_NAME \
            -e repo_root=$FORGEJO_WORKSPACE \
            --private-key=$HOME/.ssh/homelab-runner \
            -i ansible/inventory/hosts.yml
