name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  security-scan:
    name: Security checks
    runs-on: docker
    container:
      image: registry.louhome.xyz/lou-home/ci-tools:latest

    steps:
      - name: Run secret scan and dependency audit
        run: |
          ggshield secret scan repo
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            pip-audit
          fi

      - name: Run Ansible lint
        run: |
          ansible-lint ansible/

      - name: Run YAML lint
        run: |
          yamllint -c /dev/null .

      - name: Run workflow lint
        run: |
          find . -path "./.forgejo/workflows/*.yml" | sort | xargs -r actionlint

      - name: Run Terraform security scans
        run: |
          tfsec terraform/
          checkov -d terraform/

      - name: Run Dockerfile lint
        run: |
          find docker ci -type f \( -name 'Dockerfile' -o -name '*Dockerfile*' \) | sort | xargs -r hadolint
