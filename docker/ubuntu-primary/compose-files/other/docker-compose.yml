---
services:
  # ######### Other ##########

  # # VSCode - VSCode Editing
  vscode:
    #    user: $PUID:$PGID
    image: linuxserver/code-server:4.126.0
    container_name: vscode
    restart: always
    networks:
      - traefik_proxy
    #    ports:
    #      - "8080:8080"
    #    security_opt:
    #      - no-new-privileges:true
    volumes:
      - $DOCKER_DIR/configs/vscode:/config
      - $HOME:$HOME
    environment:
      - PUID
      - PGID
      - TZ
      # - PASSWORD=GjhnTkLerv49Qp #optional
      # - HASHED_PASSWORD= #optional
      - SUDO_PASSWORD=${VSCODE_PASSWORD} # optional
      # - SUDO_PASSWORD_HASH= #optional
      - PROXY_DOMAIN=vscode.${DOMAIN_NAME}
      - DEFAULT_WORKSPACE=$HOME
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.vscode-rtr.entrypoints=https"
      - "traefik.http.routers.vscode-rtr.rule=Host(`code.${DOMAIN_NAME}`)"
      ## Middlewares
      - "traefik.http.routers.vscode-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.vscode-rtr.service=vscode-svc"
      - "traefik.http.services.vscode-svc.loadbalancer.server.port=8443"

  ## Davos - An FTP Automation Tool
  davos:
    container_name: davos
    image: linuxserver/davos:2.2.2
    restart: always
    networks:
      - traefik_proxy
    ports:
      - "8112:8080"
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKER_DIR/configs/davos:/config
      - $DOWNLOADS_DIR:/downloads
    environment:
      - PUID
      - PGID
      - TZ
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.davos-rtr.entrypoints=https"
      - "traefik.http.routers.davos-rtr.rule=Host(`davos.${DOMAIN_NAME}`)"
      ## Middlewares
      - "traefik.http.routers.davos-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.davos-rtr.service=davos-svc"
      - "traefik.http.services.davos-svc.loadbalancer.server.port=8080"

  ## Syncthing – Continuous File Synchronization
  ## Fix inotify limit error - Need to run on host
  #https://docs.syncthing.net/users/faq.html#inotify-limits
  # echo "fs.inotify.max_user_watches=204800" | sudo tee -a /etc/sysctl.d/90-override.conf
  # This only takes effect after a reboot. To adjust the limit immediately, run:
  # sudo sh -c 'echo 204800 > /proc/sys/fs/inotify/max_user_watches'

  syncthing:
    container_name: syncthing
    image: linuxserver/syncthing:2.1.1
    restart: always
    networks:
      - traefik_proxy
      - socket_proxy
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKER_DIR/data/syncthing:/data/default
      - $DOCKER_DIR/scripts/syncthing:/data/scripts
      - $DOCKER_DIR/configs/syncthing:/config
    environment:
      - PUID
      - PGID
      - TZ
      - UMASK_SET=022
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.syncthing-rtr.entrypoints=https"
      - "traefik.http.routers.syncthing-rtr.rule=Host(`syncthing.${DOMAIN_NAME}`)"
      ## Middlewares
      - "traefik.http.routers.syncthing-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.syncthing-rtr.service=syncthing-svc"
      - "traefik.http.services.syncthing-svc.loadbalancer.server.port=8384"

  filebrowser:
    container_name: filebrowser
    image: gtstef/filebrowser:1.5.0-beta
    restart: unless-stopped
    networks:
      - traefik_proxy
      - socket_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - /mnt:/mnt/truenas
      - $DOCKER_DIR/configs/filebrowser:/home/filebrowser/data
    environment:
      - PUID
      - PGID
      - TZ
      - FILEBROWSER_CONFIG=/home/filebrowser/data/config.yaml
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.filebrowser-rtr.entrypoints=https"
      - "traefik.http.routers.filebrowser-rtr.rule=Host(`filebrowser.${DOMAIN_NAME}`)"
      ## Middlewares
      - "traefik.http.routers.filebrowser-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.filebrowser-rtr.service=filebrowser-svc"
      - "traefik.http.services.filebrowser-svc.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  stirling-pdf:
    container_name: stirling
    image: stirlingtools/stirling-pdf:2.13.2
    restart: always
    networks:
      - traefik_proxy
      - socket_proxy
    ports:
      - "8891:8080"
    volumes:
      - $DOCKER_DIR/data/stirling:/usr/share/tesseract-ocr/5/tessdata # Required for extra OCR languages
      - $DOCKER_DIR/configs/stirling:/configs
    #      - /location/of/customFiles:/customFiles/
    #      - /location/of/logs:/logs/
    environment:
      - DOCKER_ENABLE_SECURITY=true
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.stirling-rtr.entrypoints=https"
      - "traefik.http.routers.stirling-rtr.rule=Host(`pdf.${DOMAIN_NAME}`)"
      ## Middlewares
      - "traefik.http.routers.stirling-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.stirling-rtr.service=stirling-svc"
      - "traefik.http.services.stirling-svc.loadbalancer.server.port=8080"

  paperless-redis:
    container_name: paperless-redis
    image: redis:8.8.0-alpine
    restart: unless-stopped
    networks:
      - socket_proxy
    volumes:
      - $DOCKER_DIR/data/paperless-redis:/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
    container_name: paperless
    networks:
      - traefik_proxy
      - socket_proxy
    environment:
      - PUID
      - PGID
      - TZ
      - PAPERLESS_URL=https://paperless.${DOMAIN_NAME}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASS}
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      # - PAPERLESS_DBHOST=postgres
    volumes:
      - $DOCKER_DIR/data/paperless:/usr/src/paperless/data
      - $DOCKER_DIR/data/paperless/media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    ports:
      - 8212:8000
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.paperless-rtr.entrypoints=https"
      - "traefik.http.routers.paperless-rtr.rule=Host(`paperless.${DOMAIN_NAME}`)"
      ## Middlewares
      - "traefik.http.routers.paperless-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.paperless-rtr.service=paperless-svc"
      - "traefik.http.services.paperless-svc.loadbalancer.server.port=8000"

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.20.0
    container_name: mealie
    networks:
      - traefik_proxy
      - socket_proxy
    ports:
      - 9925:9000
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - $DOCKER_DIR/data/mealie:/app/data/
    environment:
      - ALLOW_SIGNUP=true
      - PUID
      - PGID
      - TZ
      - BASE_URL=https://mealie.${DOMAIN_NAME}
      - OIDC_AUTH_ENABLED=true
      - OIDC_PROVIDER_NAME=pocketid
      - OIDC_CONFIGURATION_URL=https://auth.${DOMAIN_NAME}/.well-known/openid-configuration
      - OIDC_CLIENT_ID=${MEALIE_OIDC_CLIENT_ID} # <Client ID from authentik>
      - OIDC_CLIENT_SECRET=${MEALIE_OIDC_CLIENT_SECRET} # <Client secret from authentik>
      - OIDC_SIGNUP_ENABLED=true
      - OIDC_USER_GROUP=mealie-users
      - OIDC_ADMIN_GROUP=mealie-admins
      - OIDC_AUTO_REDIRECT=true # Optional: The login page will be bypassed and you will be sent directly to your Identity Provider.
      - OIDC_REMEMBER_ME=true
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.mealie-rtr.entrypoints=https"
      - "traefik.http.routers.mealie-rtr.rule=Host(`mealie.${DOMAIN_NAME}`)"
      ## Middlewares
      - "traefik.http.routers.mealie-rtr.middlewares=chain-noauth@file"
      ## HTTP Services
      - "traefik.http.routers.mealie-rtr.service=mealie-svc"
      - "traefik.http.services.mealie-svc.loadbalancer.server.port=9000"

networks:
  traefik_proxy:
    external: true
  socket_proxy:
    external: true
