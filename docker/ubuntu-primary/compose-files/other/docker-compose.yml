---
services:
  ########## Other  ##########

  ## VSCode - VSCode Editing
  vscode:
    #    user: $PUID:$PGID
    image: linuxserver/code-server:4.133.0
    container_name: vscode
    restart: always
    networks: [traefik_proxy]
    volumes: [$DOCKER_DIR/data/vscode:/config, $HOME:$HOME]
    environment:
      - PUID
      - PGID
      - TZ
      - SUDO_PASSWORD=${VSCODE_PASSWORD}  # optional
      - PROXY_DOMAIN=vscode.${DOMAIN_NAME}
      - DEFAULT_WORKSPACE=$HOME
    labels:
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.vscode-rtr.entrypoints=https
      - traefik.http.routers.vscode-rtr.rule=Host(`code.${DOMAIN_NAME}`)
      ## Middlewares
      - traefik.http.routers.vscode-rtr.middlewares=chain-oauth@file
      ## HTTP Services
      - traefik.http.routers.vscode-rtr.service=vscode-svc
      - traefik.http.services.vscode-svc.loadbalancer.server.port=8443
      - homepage.group=Management
      - homepage.name=Code Server
      - homepage.icon=vscode
      - homepage.description=VS Code in the browser
      - homepage.href=https://code.${DOMAIN_NAME}
    healthcheck:
      test: [CMD-SHELL, pgrep -f code-server >/dev/null || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  syncthing:
    container_name: syncthing
    image: linuxserver/syncthing:2.1.3
    restart: always
    networks: [traefik_proxy, socket_proxy]
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    security_opt: [no-new-privileges:true]
    volumes:
      - $DOCKER_DIR/data/syncthing:/data/default
      - $DOCKER_DIR/data/syncthing/scripts:/data/scripts
      - $DOCKER_DIR/data/syncthing/config:/config
    environment: [PUID, PGID, TZ, UMASK_SET=022]
    labels:
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.syncthing-rtr.entrypoints=https
      - traefik.http.routers.syncthing-rtr.rule=Host(`syncthing.${DOMAIN_NAME}`)
      ## Middlewares
      - traefik.http.routers.syncthing-rtr.middlewares=chain-oauth@file
      ## HTTP Services
      - traefik.http.routers.syncthing-rtr.service=syncthing-svc
      - traefik.http.services.syncthing-svc.loadbalancer.server.port=8384
      - homepage.group=Management
      - homepage.name=Syncthing
      - homepage.icon=syncthing
      - homepage.description=Secure file sync and backup
      - homepage.href=https://syncthing.${DOMAIN_NAME}
    healthcheck:
      test: [CMD-SHELL, curl -f http://127.0.0.1:8384/ || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  paperless-redis:
    container_name: paperless-redis
    image: redis:8.10.0-alpine
    restart: unless-stopped
    networks: [socket_proxy]
    volumes: [$DOCKER_DIR/data/paperless-redis:/data]
    healthcheck:
      test: [CMD-SHELL, redis-cli ping || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    container_name: paperless
    networks: [traefik_proxy, socket_proxy]
    environment:
      - USERMAP_UID=${PUID}
      - USERMAP_GID=${PGID}
      - TZ
      - PAPERLESS_URL=https://paperless.${DOMAIN_NAME}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASS}
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_CONSUMER_POLLING=60
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
    volumes:
      - $DOCKER_DIR/data/paperless:/usr/src/paperless/data
      - $DOCKER_DIR/data/paperless/media:/usr/src/paperless/media
      - $DOCKER_DIR/data/paperless/consume:/usr/src/paperless/consume
      - $DOCKER_DIR/data/paperless/export:/usr/src/paperless/export
    ports: [8212:8000]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.paperless-rtr.entrypoints=https
      - traefik.http.routers.paperless-rtr.rule=Host(`paperless.${DOMAIN_NAME}`)
      ## Middlewares
      - traefik.http.routers.paperless-rtr.middlewares=chain-oauth@file
      ## HTTP Services
      - traefik.http.routers.paperless-rtr.service=paperless-svc
      - traefik.http.services.paperless-svc.loadbalancer.server.port=8000
      - homepage.group=Management
      - homepage.name=Paperless
      - homepage.icon=paperless-ngx
      - homepage.description=Document management and OCR
      - homepage.href=https://paperless.${DOMAIN_NAME}
    healthcheck:
      test: [CMD-SHELL, curl -f http://127.0.0.1:8000/ || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.23.1
    container_name: mealie
    networks: [traefik_proxy, socket_proxy]
    ports: [9925:9000]
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes: [$DOCKER_DIR/data/mealie:/app/data/]
    environment:
      - ALLOW_SIGNUP=true
      - PUID
      - PGID
      - TZ
      - BASE_URL=https://mealie.${DOMAIN_NAME}
      - OIDC_AUTH_ENABLED=true
      - OIDC_PROVIDER_NAME=pocketid
      - OIDC_CONFIGURATION_URL=https://auth.${DOMAIN_NAME}/.well-known/openid-configuration
      - OIDC_CLIENT_ID=${MEALIE_OIDC_CLIENT_ID}  # <Client ID from authentik>
      - OIDC_CLIENT_SECRET=${MEALIE_OIDC_CLIENT_SECRET}  # <Client secret from authentik>
      - OIDC_SIGNUP_ENABLED=true
      - OIDC_USER_GROUP=mealie-users
      - OIDC_ADMIN_GROUP=mealie-admins
      - OIDC_AUTO_REDIRECT=true  # Optional: The login page will be bypassed and you will be sent directly to your Identity Provider.
      - OIDC_REMEMBER_ME=true
    restart: unless-stopped
    labels:
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.mealie-rtr.entrypoints=https
      - traefik.http.routers.mealie-rtr.rule=Host(`mealie.${DOMAIN_NAME}`)
      ## Middlewares
      - traefik.http.routers.mealie-rtr.middlewares=chain-noauth@file
      ## HTTP Services
      - traefik.http.routers.mealie-rtr.service=mealie-svc
      - traefik.http.services.mealie-svc.loadbalancer.server.port=9000
      - homepage.group=Management
      - homepage.name=Mealie
      - homepage.icon=mealie
      - homepage.description=Recipe manager and meal planning
      - homepage.href=https://mealie.${DOMAIN_NAME}
    healthcheck:
      test: [CMD-SHELL, curl -f http://127.0.0.1:9000/ || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
networks:
  traefik_proxy:
    external: true
  socket_proxy:
    external: true
