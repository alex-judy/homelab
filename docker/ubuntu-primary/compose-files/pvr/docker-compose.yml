      ## HTTP Services
    - "traefik.http.routers.dispatcharr-rtr.service=dispatcharr-svc"
    - "traefik.http.services.dispatcharr-svc.loadbalancer.server.port=9191"
      ## API Forward Auth Bypass
    - "traefik.http.routers.dispatcharr-bypass.entrypoints=https"
      # - "traefik.http.routers.dispatcharr-bypass.rule=Host(`dispatcharr.${DOMAIN_NAME}`) && (Header(`X-Api-Key`, `$dispatcharr_API_KEY`) || Query(`apikey`, `$dispatcharr_API_KEY`))"
    - "traefik.http.routers.dispatcharr-bypass.priority=20"
    - "traefik.http.routers.dispatcharr-bypass.service=dispatcharr-svc"
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f dispatcharr >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  traefik_proxy:
    external: true
  socket_proxy:
    external: true
