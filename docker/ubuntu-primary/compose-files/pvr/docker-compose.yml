services:
  ########## Media Automation ##########

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.0.9
    container_name: profilarr
    ports:
    - 6868:6868
    volumes:
    - $DOCKER_DIR/data/profilarr:/config
    environment:
    - PUID
    - PGID
    - TZ
    - UMASK=022
    - AUTH=oidc
    - OIDC_DISCOVERY_URL=https://auth.louhome.xyz/.well-known/openid-configuration
    - OIDC_CLIENT_ID=${PROFILARR_OIDC_CLIENT_ID}
    - OIDC_CLIENT_SECRET=${PROFILARR_OIDC_CLIENT_SECRET}
    - ORIGIN=https://profilarr.${DOMAIN_NAME}
    restart: unless-stopped
    networks:
    - traefik_proxy
    - socket_proxy
    labels:
    - "traefik.enable=true"
      ## HTTP Routers
    - "traefik.http.routers.profilarr-rtr.entrypoints=https"
    - "traefik.http.routers.profilarr-rtr.rule=Host(`profilarr.${DOMAIN_NAME}`)"
    - "traefik.http.routers.profilarr-rtr.priority=10"
      ## Middlewares
    - "traefik.http.routers.profilarr-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
    - "traefik.http.routers.profilarr-rtr.service=profilarr-svc"
    - "traefik.http.services.profilarr-svc.loadbalancer.server.port=6868"
      ## API Forward Auth Bypass
    - "traefik.http.routers.profilarr-bypass.entrypoints=https"
    - "traefik.http.routers.profilarr-bypass.priority=20"
    - "traefik.http.routers.profilarr-bypass.service=profilarr-svc"
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:6868/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  radarr:
    container_name: radarr
    image: linuxserver/radarr:6.2.1
    restart: unless-stopped
    networks:
      traefik_proxy:
        # ipv4_address: 192.168.50.245
    ports:
    - "7878:7878"
    security_opt:
    - no-new-privileges:true
    volumes:
    - $DOCKER_DIR/data/radarr:/config
    - $DOWNLOADS_DIR/torrents/movies-hd:/downloads/torrents/movies-hd
    - $DOWNLOADS_DIR/usenet/complete/movies-hd:/downloads/complete/movies-hd
    - $MEDIA_DIR/movies/HD:/movies
    - $DOWNLOADS_DIR/usenet/default:/downloads/manual
    environment:
    - PUID
    - PGID
    - TZ
    - UMASK=002
    labels:
    - "traefik.enable=true"
      ## HTTP Routers
    - "traefik.http.routers.radarr-rtr.entrypoints=https"
    - "traefik.http.routers.radarr-rtr.rule=Host(`radarr.${DOMAIN_NAME}`)"
    - "traefik.http.routers.radarr-rtr.priority=10"
      ## Middlewares
      # - "traefik.http.routers.radarr-rtr.middlewares=chain-oauth@file"
    - "traefik.http.routers.radarr-rtr.middlewares=oidc-auth@file"
      ## HTTP Services
    - "traefik.http.routers.radarr-rtr.service=radarr-svc"
    - "traefik.http.services.radarr-svc.loadbalancer.server.port=7878"
      ## API Forward Auth Bypass
    - "traefik.http.routers.radarr-bypass.entrypoints=https"
    - "traefik.http.routers.radarr-bypass.rule=Host(`radarr.${DOMAIN_NAME}`) && (Header(`X-Api-Key`,
      `$RADARR_API_KEY`) || Query(`apikey`, `$RADARR_API_KEY`))"
    - "traefik.http.routers.radarr-bypass.priority=20"
    - "traefik.http.routers.radarr-bypass.service=radarr-svc"
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:7878/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

