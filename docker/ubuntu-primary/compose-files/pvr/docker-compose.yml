    - "traefik.enable=true"
      ## HTTP Routers
    - "traefik.http.routers.dispatcharr-rtr.entrypoints=https"
    - "traefik.http.routers.dispatcharr-rtr.rule=Host(`dispatcharr.${DOMAIN_NAME}`)"
