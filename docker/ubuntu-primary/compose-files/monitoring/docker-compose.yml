---
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.2.0
    container_name: komodo-periphery
    restart: unless-stopped
    environment:
      PERIPHERY_CORE_ADDRESS: https://komodo.louhome.xyz
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_CONNECT_AS: vali
      PERIPHERY_ONBOARDING_KEY: ${KOMODO_ONBOARDING_KEY}
      PERIPHERY_CORE_PUBLIC_KEYS: ${KOMODO_CORE_PUBLIC_KEYS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $DOCKER_DIR/data/komodo-periphery:/etc/komodo
    healthcheck:
      test: [CMD-SHELL, grep -q periphery /proc/1/comm]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  dozzle:
    image: amir20/dozzle:v10.6
    container_name: dozzle
    restart: always
    networks: [traefik_proxy, socket_proxy]
    ports: [3661:8080]
    security_opt: [no-new-privileges:true]
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 300
      DOZZLE_FILTER: status=running
      DOCKER_HOST: tcp://socket-proxy:2375
    labels:
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.dozzle-rtr.entrypoints=https
      - traefik.http.routers.dozzle-rtr.rule=Host(`dozzle.${DOMAIN_NAME}`)
      ## Middlewares
      - traefik.http.routers.dozzle-rtr.middlewares=chain-oauth@file
      ## HTTP Services
      - traefik.http.routers.dozzle-rtr.service=dozzle-svc
      - traefik.http.services.dozzle-svc.loadbalancer.server.port=8080
      - homepage.group=Monitoring
      - homepage.name=Dozzle
      - homepage.icon=dozzle
      - homepage.description=Container log viewer
      - homepage.href=https://dozzle.${DOMAIN_NAME}
    healthcheck:
      test: [CMD, /dozzle, healthcheck]
      interval: 3s
      timeout: 30s
      retries: 5
      start_period: 30s
  tracearr:
    image: ghcr.io/connorgallopo/tracearr:1.5.0
    container_name: tracearr
    ports: [3001:3000]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=${TZ:-UTC}
      - DATABASE_URL=postgres://tracearr:${TRACEARR_DB_PASSWORD:-tracearr}@tracearr-db:5432/tracearr
      - REDIS_URL=redis://tracearr-redis:6379
      - JWT_SECRET=${TRACEARR_JWT_SECRET}
      - COOKIE_SECRET=${TRACEARR_COOKIE_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # - DATABASE_POOL_MAX=50  # Database connection pool size (default: 50)
    depends_on:
      tracearr-db:
        condition: service_healthy
      tracearr-redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [traefik_proxy]
    labels:
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.tracearr-rtr.entrypoints=https
      - traefik.http.routers.tracearr-rtr.rule=Host(`tracearr.${DOMAIN_NAME}`)
      ## Middlewares
      - traefik.http.routers.tracearr-rtr.middlewares=chain-oauth@file
      ## HTTP Services
      - traefik.http.routers.tracearr-rtr.service=tracearr-svc
      - traefik.http.services.tracearr-svc.loadbalancer.server.port=3000
      - homepage.group=Monitoring
      - homepage.name=Tracearr
      - homepage.icon=tracearr
      - homepage.description=Media request trace and monitoring
      - homepage.href=https://tracearr.${DOMAIN_NAME}
    healthcheck:
      test: [CMD-SHELL, "ps -ef | grep -v grep | grep -q '[n]ode' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  tracearr-db:
    # TimescaleDB HA with PostgreSQL 18 and Toolkit
    # PostgreSQL 18 features: AIO for 3x I/O performance, UUIDv7, temporal constraints
    # Note: ~1.5GB image size (includes Patroni, backup tools, many extensions)
    image: timescale/timescaledb:2.28.3-pg18
    container_name: tracearr-db
    shm_size: 512mb  # Required for PostgreSQL shared memory (increase for large imports)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536  # TimescaleDB chunks require many file descriptors
    # Allow unlimited tuple decompression for migrations on compressed hypertables
    # Increase lock table size for large imports (Tautulli imports with many TimescaleDB chunks)
    command: postgres -c timescaledb.max_tuples_decompressed_per_dml_transaction=0
      -c max_locks_per_transaction=4096
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=${TRACEARR_DB_PASSWORD:-tracearr}
      - POSTGRES_DB=tracearr
    volumes: [$DOCKER_DIR/data/tracearr-db:/home/postgres/pgdata/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tracearr]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [traefik_proxy]
  tracearr-redis:
    image: redis:8.8.1-alpine
    container_name: tracearr-redis
    command: redis-server --appendonly yes
    volumes: [$DOCKER_DIR/data/tracearr-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [traefik_proxy]
networks:
  traefik_proxy:
    external: true
  socket_proxy:
    external: true
