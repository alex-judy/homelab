---
services:
  # ######### Network Stack ##########

  # # Docker Socket Proxy - Security Enchanced Proxy for Docker Socket
  socket-proxy:
    container_name: socket-proxy
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: always
    privileged: true
    networks:
      - socket_proxy
    ports:
      - 2375:2375
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOG_LEVEL=info # debug,info,notice,warning,err,crit,alert,emerg
      - EVENTS=1
      - PING=1
      - VERSION=1
      - AUTH=0
      - SECRETS=0
      - POST=1
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1 #
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=1
      - INFO=1
      - NETWORKS=1 #
      - NODES=0
      - PLUGINS=0
      - SERVICES=1 #
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=1 #
      - VOLUMES=1

  ## Cloudflare Tunnel - Secure, fast, reliable, and free tunnel to your localhost
  cf-tunnel:
    image: cloudflare/cloudflared:2026.6.0
    container_name: cf-tunnel
    restart: "unless-stopped"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      cloudflared:
    command: tunnel --no-autoupdate run

  ## Traefik - Reverse Proxy
  traefik:
    container_name: traefik
    image: traefik:v3.7.5
    # profiles:
    #   - traefik-network
    restart: always
    command:
      # CLI arguments
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=true
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --entrypoints.tcp.address=:21000/tcp
      - --entrypoints.udp.address=:21000/udp
      - --entryPoints.http.forwardedHeaders.trustedIPs=127.0.0.1/32,192.168.0.0/16,10.0.0.0/8
      - --entryPoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1/32,192.168.0.0/16,10.0.0.0/8
      - --api=true
      - --log=true
      - --log.filePath=/logs/traefik.log
      - --log.level=INFO # (Default: error) DEBUG, INFO, WARN, ERROR, FATAL, PANIC
      - --log.maxSize=200 # Maximum log file size in MB
      - --accesslog=true
      - --accesslog.filepath=/logs/access.log
      - --accesslog.format=json
      - --accesslog.filters.statuscodes=400-599
      - --accessLog.bufferingSize=0 # Configuring a buffer of 100 lines
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.User-Agent=keep
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375 # My docker-socket-proxy
      - --providers.docker.defaultrule=Host(`{{ index .Labels "com.docker.compose.service" }}.${DOMAIN_NAME}`)
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=traefik_proxy
      # - --providers.docker.swarmMode=false
      - --providers.file.directory=/rules # Load dynamic configuration from one or more .toml or .yml files in a directory.
      - --providers.file.watch=true # Only works on top level files in the rules folder
      - --entrypoints.https.http.tls=true
      - --entrypoints.https.http.tls.certresolver=cloudflare
      - --entrypoints.https.http.tls.domains[0].main=${DOMAIN_NAME}
      - --entrypoints.https.http.tls.domains[0].sans=*.${DOMAIN_NAME}
      - --certificatesResolvers.cloudflare.acme.email=${CLOUDFLARE_EMAIL}
      - --certificatesResolvers.cloudflare.acme.storage=/acme.json
      - --certificatesResolvers.cloudflare.acme.dnsChallenge.provider=cloudflare
      - --metrics.prometheus.addrouterslabels=true
      - --experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.crowdsec-bouncer.version=v1.4.6
      - --experimental.plugins.traefikoidc.modulename=github.com/lukaszraczylo/traefikoidc
      - --experimental.plugins.traefikoidc.version=v0.7.10
    networks:
      cloudflared:
      traefik_proxy:
      # ipv4_address: 192.168.200.2
      socket_proxy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # - $DOCKER_DIR/data/traefik:/etc/traefik
      - $DOCKER_DIR/traefik/rules:/rules # file provider directory
      - $DOCKER_DIR/traefik/acme/acme.json:/acme.json # cert location - you must touch this file and change permissions to 600
      - $DOCKER_DIR/traefik/logs:/logs # for fail2ban - make sure to touch file before starting container
    environment:
      - CF_API_EMAIL=${CLOUDFLARE_EMAIL}
      - CF_API_KEY=${CLOUDFLARE_API_KEY}
      - CROWDSEC_BOUNCER_TRAEFIK_API_KEY=${CROWDSEC_BOUNCER_TRAEFIK_API_KEY}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
      - OIDC_CLIENT_ID=${TRAEFIK_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${TRAEFIK_OIDC_CLIENT_SECRET}
      - OIDC_SESSION_KEY=${TRAEFIK_OIDC_SESSION_KEY}
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.traefik-rtr.entrypoints=https"
      - "traefik.http.routers.traefik-rtr.rule=Host(`traefik.${DOMAIN_NAME}`)"
      - "traefik.http.routers.traefik-rtr.priority=10"
      ## Middlewares
      - "traefik.http.routers.traefik-rtr.middlewares=chain-oauth@file"
      ## Services - API
      - "traefik.http.routers.traefik-rtr.service=api@internal"
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  traefik_proxy:
    external: true
  socket_proxy:
    external: true
  cloudflared:
    external: true
