---
x-defaults: &default-settings
  restart: unless-stopped
  networks: [traefik_proxy]
  security_opt: [no-new-privileges:true]
services:
  speedtest:
    <<: *default-settings
    container_name: speedtest
    image: openspeedtest/latest:v2.0.6
    ports: [3010:3000, 3011:3001]
    labels:
      - traefik.enable=true
      - homepage.group=Utilities
      - homepage.name=Speedtest
      - homepage.icon=speedtest
      - homepage.description=Bandwidth testing utility
      - homepage.href=https://speedtest.${DOMAIN_NAME}
      # HTTP Routers
      - traefik.http.routers.speedtest-rtr.entrypoints=https
      - traefik.http.routers.speedtest-rtr.rule=Host(`speedtest.${DOMAIN_NAME}`)
      ## Middlewares
      - traefik.http.routers.speedtest-rtr.middlewares=chain-oauth@file
      ## HTTP Services
      - traefik.http.routers.speedtest-rtr.service=speedtest-svc
      - traefik.http.services.speedtest-svc.loadbalancer.server.port=3000
    healthcheck:
      test: [CMD-SHELL, curl -f http://127.0.0.1:3000/ || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
networks:
  traefik_proxy:
    external: true
  socket_proxy:
    external: true
