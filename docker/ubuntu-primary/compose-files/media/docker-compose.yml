---
services:
  # ######### Media and Media Requests ##########
  # # Doplarr
  doplarr:
    image: lscr.io/linuxserver/doplarr:3.8.0
    container_name: doplarr
    networks:
      - traefik_proxy
    environment:
      - PUID
      - PGID
      - TZ
      - DISCORD__TOKEN=${DISCORD_TOKEN}
      - OVERSEERR__API=${OVERSEER_API_KEY}
      - OVERSEERR__URL=https://overseerr.${DOMAIN_NAME}
      # - RADARR__API=
      # - RADARR__URL=
      # - SONARR__API=
      # - SONARR__URL=
      - DISCORD__MAX_RESULTS=25 # optional
      - DISCORD__REQUESTED_MSG_STYLE=:plain # optional
      - SONARR__QUALITY_PROFILE= # optional
      - RADARR__QUALITY_PROFILE= # optional
      - SONARR__ROOTFOLDER= # optional
      - RADARR__ROOTFOLDER= # optional
      - SONARR__LANGUAGE_PROFILE= # optional
      - OVERSEERR__DEFAULT_ID= # optional
      - PARTIAL_SEASONS=true # optional
      - LOG_LEVEL=:info # optional
      - JAVA_OPTS= # optional
    volumes:
      - $DOCKER_DIR/configs/doplarr:/config
    restart: unless-stopped

  ## Overseerr
  overseerr:
    # user: $PUID
    image: ghcr.io/seerr-team/seerr:v3.3.0
    init: true
    container_name: seerr
    networks:
      - traefik_proxy
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - $DOCKER_DIR/configs/overseerr:/app/config
    ports:
      - 5055:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.overseerr-rtr.entrypoints=https"
      - "traefik.http.routers.overseerr-rtr.rule=Host(`overseerr.${DOMAIN_NAME}`) || Host(`seerr.${DOMAIN_NAME}`)"
      ## Middlewares
      - "traefik.http.routers.overseerr-rtr.middlewares=chain-noauth@file"
      ## HTTP Services
      - "traefik.http.routers.overseerr-rtr.service=overseerr-svc"
      - "traefik.http.services.overseerr-svc.loadbalancer.server.port=5055"

networks:
  traefik_proxy:
    external: true
  socket_proxy:
    external: true
