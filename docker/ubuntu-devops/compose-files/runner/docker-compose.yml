---
services:
  docker-in-docker:
    image: docker:dind
    extra_hosts:
      - "registry.${DOMAIN_NAME}:10.0.10.30"
    container_name: docker_dind
    privileged: true
    ports:
      - "2375:2375"
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    restart: unless-stopped

  runner:
    image: data.forgejo.org/forgejo/runner:12
    extra_hosts:
      - "registry.${DOMAIN_NAME}:10.0.10.30"
    container_name: runner
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      docker-in-docker:
        condition: service_started
    # ADD THIS ENVIRONMENT SECTION:
    environment:
      - DOCKER_HOST=tcp://127.0.0.1:2375
    volumes:
      - $DOCKER_DIR/data/runner:/data
    network_mode: "host"
    command: ["forgejo-runner", "-c", "/data/runner-config.yml", "daemon"]
