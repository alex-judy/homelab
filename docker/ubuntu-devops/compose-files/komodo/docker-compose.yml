---
services:
  # komodo-mongo:
  #   image: mongo:8.3.4
  #   container_name: komodo-mongo
  #   labels:
  #     komodo.skip:  # Prevent Komodo from stopping with StopAllContainers
  #   command: --quiet --wiredTigerCacheSizeGB 0.25
  #   restart: unless-stopped
  #  # ports:
  #  #   - 27017:27017
  #   volumes:
  #     - $DOCKER_DIR/data/komodo-mongo:/data/db
  #     - $DOCKER_DIR/data/komodo-mongo/config:/data/configdb
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
  #     MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
  komodo-postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0
    container_name: komodo-postgres
    labels:
      komodo.skip:  # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    # ports:
    #   - 5432:5432
    volumes:
      - $DOCKER_DIR/data/komodo-postgres/postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
  komodo-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: komodo-ferretdb
    labels:
      komodo.skip:  # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - komodo-postgres
    # ports:
    #   - 27017:27017
    volumes: [$DOCKER_DIR/data/komodo-ferretdb/state:/state]
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@komodo-postgres:5432/postgres?sslmode=disable
  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2.3.2
    container_name: komodo-core
    init: true
    restart: unless-stopped
    depends_on: [komodo-ferretdb]
    ports: [9120:9120]
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_HOST: ${KOMODO_HOST}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      # OIDC (Pocket ID) - matches your existing pattern
      KOMODO_OIDC_ENABLED: 'true'
      KOMODO_OIDC_PROVIDER: ${KOMODO_OIDC_PROVIDER}
      KOMODO_OIDC_CLIENT_ID: ${KOMODO_OIDC_CLIENT_ID}
      KOMODO_OIDC_CLIENT_SECRET: ${KOMODO_OIDC_CLIENT_SECRET}
    volumes:
      - $DOCKER_DIR/data/komodo-core:/repo-cache
      - $DOCKER_DIR/data/komodo-core/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - homepage.group=Development
      - homepage.name=Komodo
      - homepage.icon=komodo
      - homepage.description=Self-hosted automation and management
      - homepage.href=https://komodo.${DOMAIN_NAME}
    healthcheck:
      test: [CMD-SHELL, curl -f http://127.0.0.1:9120/ || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.2
    container_name: komodo-periphery
    restart: unless-stopped
    depends_on: [komodo-core]
    environment:
      PERIPHERY_CORE_ADDRESS: http://komodo-core:9120
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_CONNECT_AS: ubuntu-devops
      PERIPHERY_ONBOARDING_KEY: ${KOMODO_ONBOARDING_KEY}
      PERIPHERY_CORE_PUBLIC_KEYS: ${KOMODO_CORE_PUBLIC_KEYS}
    volumes:
      - /proc:/proc
      - /var/run/docker.sock:/var/run/docker.sock
      - $DOCKER_DIR/data/komodo-periphery:/etc/komodo
    healthcheck:
      test: [CMD-SHELL, grep -q periphery /proc/1/comm]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  # Mongo
  mongo-data:
  mongo-config:
