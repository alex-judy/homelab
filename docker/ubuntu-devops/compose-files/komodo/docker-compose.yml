---
services:
  # komodo-mongo:
  #   image: mongo:8.3.4
  #   container_name: komodo-mongo
  #   labels:
  #     komodo.skip: # Prevent Komodo from stopping with StopAllContainers
  #   command: --quiet --wiredTigerCacheSizeGB 0.25
  #   restart: unless-stopped
  #   # ports:
  #   #   - 27017:27017
  #   volumes:
  #     - $DOCKER_DIR/data/komodo-mongo:/data/db
  #     - $DOCKER_DIR/data/komodo-mongo/config:/data/configdb
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
  #     MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}

  komodo-postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0
    container_name: komodo-postgres
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    # ports:
    #   - 5432:5432
    volumes:
      - $DOCKER_DIR/data/komodo-postgres/postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}


  core:
    image: ghcr.io/moghtech/komodo-core:2.2.0
    container_name: komodo-core
    init: true
    restart: unless-stopped
    depends_on:
      - komodo-postgres
    ports:
      - 9120:9120
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-postgres:5432
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_HOST: ${KOMODO_HOST}
      KOMODO_PASSKEY: ${KOMODO_PASSKEY}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      # OIDC (Pocket ID) - matches your existing pattern
      KOMODO_OIDC_ENABLED: "true"
      KOMODO_OIDC_PROVIDER: ${KOMODO_OIDC_PROVIDER}
      KOMODO_OIDC_CLIENT_ID: ${KOMODO_OIDC_CLIENT_ID}
      KOMODO_OIDC_CLIENT_SECRET: ${KOMODO_OIDC_CLIENT_SECRET}
    volumes:
      - $DOCKER_DIR/data/komodo-core:/repo-cache
      - /var/run/docker.sock:/var/run/docker.sock

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.2.0
    container_name: komodo-periphery
    restart: unless-stopped
    network_mode: host
    environment:
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_PASSKEYS: ${KOMODO_PASSKEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $DOCKER_DIR/data/komodo-periphery:/etc/komodo

volumes:
  # Mongo
  mongo-data:
  mongo-config:
