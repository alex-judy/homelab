services:
  server:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    environment:
      - USER_UID=${PUID}
      - USER_GID=${PGID}
    restart: always
    networks:
      - forgejo
    volumes:
      - $DOCKER_DIR/data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 3000:3000
      - 222:22

networks:
  forgejo:
    external: false
